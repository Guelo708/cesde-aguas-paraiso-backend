# =========================================================================
# Identificación de la aplicación
# =========================================================================
spring.application.name=aguas-paraiso

# =========================================================================
# Variables de entorno para desarrollo local
# =========================================================================
# Importa opcionalmente el archivo .env ubicado en la raíz.
# En Render no será necesario, porque las variables se configuran
# directamente en el panel del servicio.
spring.config.import=optional:file:.env[.properties]

# =========================================================================
# Conexión con PostgreSQL en Neon
# =========================================================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# =========================================================================
# Configuración de JPA e Hibernate
# =========================================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =========================================================================
# Puerto de la aplicación
# =========================================================================
# Usa el puerto proporcionado por Render.
# Cuando PORT no existe, utiliza 8080 para desarrollo local.
server.port=${PORT:8080}

# =========================================================================
# Documento OpenAPI
# =========================================================================
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs

# =========================================================================
# Swagger UI
# =========================================================================
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# =========================================================================
# Scalar
# =========================================================================
scalar.enabled=true
scalar.path=/scalar
scalar.url=/v3/api-docs